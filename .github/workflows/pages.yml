# Deploy every web app in this repo to GitHub Pages, plus the root landing page.
#
# Convention: a top-level folder <app>/ has a web version when it contains <app>/web/.
#   <app>/web/        → published as  _site/<app>/web/
#   <app>/prep/data/  → published as  _site/<app>/prep/data/   (if present)
# Paths are preserved so apps use the same relative data paths locally and deployed,
# e.g. Greatest100/web/grid/ loads ../../prep/data/people.json.
# A web sub-app with a package.json (<app>/web/<sub>/package.json) is built and its
# dist/ is published in place of its sources.
# index.html at the repo root is the landing page that links to each app.
#
# One-time setup: Settings → Pages → Source = "GitHub Actions".
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - '*/web/**'
      - '*/prep/data/**'
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html

          for webdir in */web/; do
            [ -d "$webdir" ] || continue
            app=${webdir%%/*}
            echo "Publishing $app"
            mkdir -p "_site/$app"
            cp -R "$app/web" "_site/$app/web"
            if [ -d "$app/prep/data" ]; then
              mkdir -p "_site/$app/prep"
              cp -R "$app/prep/data" "_site/$app/prep/data"
            fi
            # Sub-apps with a package.json build step publish their dist/ instead of sources
            for pkg in "$app"/web/*/package.json; do
              [ -f "$pkg" ] || continue
              sub=$(dirname "$pkg")
              (cd "$sub" && npm ci && npm run build)
              rm -rf "_site/$sub" && cp -R "$sub/dist" "_site/$sub"
            done
          done

          # Redirects from the old URLs (before apps moved under Greatest100/)
          mkdir -p _site/web/grid
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=../Greatest100/web/">' > _site/web/index.html
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=../../Greatest100/web/grid/">' > _site/web/grid/index.html

          # Redirects from the greatest-100/ URLs (before rename to Greatest100/)
          mkdir -p _site/greatest-100/web/grid
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=../../Greatest100/web/">' > _site/greatest-100/web/index.html
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=../../../Greatest100/web/grid/">' > _site/greatest-100/web/grid/index.html

          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
