<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BlackExplore</title>
  <link rel="icon" href="img/blackexplore-icon.svg">
  <style>
    :root {
      --bg: #fff; --fg: #000; --muted: #6b6b70; --row: #f2f2f7; --line: #d1d1d6; --accent: #007aff;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000; --fg: #fff; --muted: #98989f; --row: #1c1c1e; --line: #38383a; --accent: #0a84ff; }
    }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; }

    header {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: calc(0.6rem + env(safe-area-inset-top, 0px)) 1rem 0.6rem;
      border-bottom: 1px solid var(--line);
    }
    header a { color: var(--accent); text-decoration: none; font-size: 1rem; }
    header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; text-align: center; }

    main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

    /* Home list */
    .home { padding: 1rem; max-width: 40rem; width: 100%; margin: 0 auto; box-sizing: border-box; }
    .home h2 { font-size: 2rem; margin: 0.5rem 0 1rem; }
    .list { list-style: none; margin: 0; padding: 0; border-radius: 10px; overflow: hidden; background: var(--row); }
    .list li + li { border-top: 1px solid var(--line); }
    .list a {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.85rem 1rem; color: inherit; text-decoration: none; font-size: 1.05rem;
    }
    .list a::after { content: "›"; color: var(--muted); font-size: 1.4rem; line-height: 1; }
    .list a:hover, .list a:focus-visible { background: var(--line); outline: none; }
    .home p { color: var(--muted); font-size: 0.9rem; }
    .home p a { color: var(--accent); }

    /* Wheel views (Timeline / Timer) */
    .wheel { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 0.75rem 1rem 1rem; gap: 0.5rem; }
    .wheel .title { font-size: 28px; font-weight: 700; margin: 0; text-align: center; }
    .wheel .more { font-size: 34px; margin: 0; }
    .wheel canvas { flex: 1; min-height: 0; width: 100%; display: block; }

    /* Font 8 / Banner views */
    .font8 { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0.75rem 1rem 1rem; gap: 0.75rem; }
    .font8 label { display: flex; gap: 0.5rem; align-items: center; font-size: 0.9rem; color: var(--muted); }
    .font8 input {
      flex: 1; min-width: 0; font: 1rem ui-monospace, monospace; padding: 0.4rem 0.6rem;
      border: 1px solid var(--line); border-radius: 8px; background: var(--row); color: var(--fg);
    }
    .stage { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    pre.glyphs { margin: 0; font-family: ui-monospace, Menlo, monospace; line-height: 1; white-space: pre; }
    .banner-track { position: absolute; left: 0; top: 50%; display: flex; will-change: transform; }
  </style>
</head>
<body>
  <header>
    <a id="back" href="#">‹ Black Power</a>
    <h1 id="navTitle"></h1>
    <span></span>
  </header>

  <main>
    <section class="home" id="view-home">
      <h2>Black Power</h2>
      <ul class="list">
        <li><a href="#timeline">Black Power Timeline</a></li>
        <li><a href="#timer">Black Power Timer</a></li>
        <li><a href="#font8">Black Font 8</a></li>
        <li><a href="#banner">Black Banner</a></li>
      </ul>
      <p>Web version of the BlackExplore iOS app. <a href="../../">← all apps</a></p>
    </section>

    <section class="wheel" id="view-wheel" hidden>
      <p class="title">Black Power taking up space</p>
      <canvas id="wheelCanvas"></canvas>
      <p class="more">...more</p>
    </section>

    <section class="font8" id="view-font8" hidden>
      <label>Text <input id="font8Input" value="Lob!" maxlength="40" autocomplete="off" spellcheck="false"></label>
      <div class="stage"><pre class="glyphs" id="font8Pre"></pre></div>
    </section>

    <section class="font8" id="view-banner" hidden>
      <label>Text <input id="bannerInput" value="Black Power " maxlength="80" autocomplete="off" spellcheck="false"></label>
      <div class="stage" id="bannerStage"><div class="banner-track" id="bannerTrack"></div></div>
    </section>
  </main>

  <script src="font8x8.js"></script>
  <script src="app.js"></script>
</body>
</html>
