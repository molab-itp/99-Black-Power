<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FaceMash</title>
  <link rel="icon" href="img/facemesh-icon.jpeg">
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    video { display: none; }
    [hidden] { display: none !important; }  /* .start sets display:flex, which would otherwise override hidden */

    .panel {
      position: fixed; left: 1rem; right: 1rem;
      bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
      padding: 1rem; border-radius: 12px; background: rgba(0, 0, 0, 0.5);
    }
    .status { font-size: 1.5rem; font-weight: 700; margin: 0; }
    .values { font: 0.8rem ui-monospace, monospace; margin: 0.25rem 0 0; font-variant-numeric: tabular-nums; }
    .toggles { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
    .toggles button {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font: 600 0.8rem system-ui, sans-serif; color: #5ce1e6; background: rgba(92, 225, 230, 0.15);
      border: 0; border-radius: 6px; padding: 0.35rem 0.6rem; cursor: pointer;
    }
    .toggles button[aria-pressed="true"] { color: #000; background: #5ce1e6; }
    .toggles svg { width: 1.1em; height: 1.1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    /* Icons only on small (phone) widths; the label stays as the accessible name. */
    @media (max-width: 500px) {
      .toggles .label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .toggles button { padding: 0.45rem 0.7rem; }
    }

    .start {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem; text-align: center; padding: 1rem;
    }
    .start img { width: 8rem; height: 8rem; border-radius: 22%; }
    .start button { font: 600 1.1rem system-ui, sans-serif; padding: 0.7rem 1.4rem; border-radius: 10px; border: 0; background: #5ce1e6; color: #000; cursor: pointer; }
    .start p { margin: 0; max-width: 24rem; opacity: 0.8; }
    .start a { color: #5ce1e6; }
  </style>
</head>
<body>
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="start" id="start">
    <img src="img/facemesh-icon.jpeg" alt="">
    <h1 style="margin:0">FaceMash</h1>
    <p id="startMsg">Tracks your face with the front camera. Video stays on your device.</p>
    <button id="startBtn" type="button">Start camera</button>
    <p><a href="../../">← all apps</a></p>
  </div>

  <div class="panel" id="panel" hidden>
    <p class="status" id="status">Loading…</p>
    <p class="values" id="counts"></p>
    <p class="values" id="values"></p>
    <div class="toggles">
      <button type="button" data-layer="showVideo" aria-pressed="true">
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>
        <span class="label">Video</span></button>
      <button type="button" data-layer="showMesh" aria-pressed="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>
        <span class="label">Mesh</span></button>
      <button type="button" data-layer="showColor" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M12 3L22 20H2z" fill="currentColor"/></svg>
        <span class="label">Color</span></button>
      <button type="button" data-layer="maskVideo" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v7a8 8 0 0 1-16 0z"/><path d="M8 9h2M14 9h2M9 14q3 2 6 0"/></svg>
        <span class="label">Mask</span></button>
      <button type="button" data-layer="fillScreen" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M3 9V3h6M3 3l7 7M21 15v6h-6M21 21l-7-7"/></svg>
        <span class="label">Fill</span></button>
    </div>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
    const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
    const MESH_COLOR = "#00ffff";
    const OUTLINE_COLORS = ["#e31b23", "#ffd700", "#00a651"];  // red, gold, green: one step per second
    const SMILE_THRESHOLD = 0.5;
    const BLINK_THRESHOLD = 0.5;

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const valuesEl = document.getElementById("values");
    const countsEl = document.getElementById("counts");

    // Which layers are visible (mirrors FaceLayers in the iOS app).
    // Defaults: colored triangles of video pixels, masked to the face, mesh off, zoomed in on the face (Fill).
    const layers = { showVideo: true, showMesh: false, showColor: true, maskVideo: true, fillScreen: true };

    // Remember the toggles across visits.
    const SETTINGS_KEY = "FaceMash.layers";
    try {
      const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
      for (const k in layers) if (typeof saved[k] === "boolean") layers[k] = saved[k];
    } catch {}
    const saveLayers = () => { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(layers)); } catch {} };

    for (const btn of document.querySelectorAll("[data-layer]")) {
      const key = btn.dataset.layer;
      btn.setAttribute("aria-pressed", layers[key]);
      btn.addEventListener("click", () => {
        layers[key] = !layers[key];
        btn.setAttribute("aria-pressed", layers[key]);
        saveLayers();
      });
    }

    // Mesh topology: edges come from MediaPipe; triangles are the 3-cycles of the edge graph.
    const EDGES = FaceLandmarker.FACE_LANDMARKS_TESSELATION.map(c => [c.start, c.end]);
    const OVAL = edgesToLoop(FaceLandmarker.FACE_LANDMARKS_FACE_OVAL);
    const TRIANGLES = trianglesFromEdges(EDGES);
    // Eye contours and the inner edge of the lips (the mouth opening), matching the iOS app.
    const INNER_LIPS = new Set([78, 95, 88, 178, 87, 14, 317, 402, 318, 324, 308, 415, 310, 311, 312, 13, 82, 81, 80, 191]);
    const OUTLINE_EDGES = [
      ...FaceLandmarker.FACE_LANDMARKS_LEFT_EYE,
      ...FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE,
      ...FaceLandmarker.FACE_LANDMARKS_LIPS.filter(c => INNER_LIPS.has(c.start) && INNER_LIPS.has(c.end)),
    ].map(c => [c.start, c.end]);

    function trianglesFromEdges(edges) {
      const adj = new Map();
      const link = (a, b) => { if (!adj.has(a)) adj.set(a, new Set()); adj.get(a).add(b); };
      for (const [a, b] of edges) { link(a, b); link(b, a); }
      const tris = [];
      for (const [a, nbrs] of adj) {
        for (const b of nbrs) {
          if (b <= a) continue;
          for (const c of adj.get(b)) {
            if (c > b && nbrs.has(c)) tris.push([a, b, c]);
          }
        }
      }
      return tris;
    }

    // Face oval connections, chained into an ordered loop of landmark indices.
    function edgesToLoop(conns) {
      const next = new Map(conns.map(c => [c.start, c.end]));
      const loop = [];
      let v = conns[0].start;
      while (next.has(v) && loop.length <= conns.length) { loop.push(v); v = next.get(v); next.delete(loop.at(-1)); }
      return loop;
    }

    // Small copy of the video frame used to sample triangle colors.
    const sampler = document.createElement("canvas");
    const sctx = sampler.getContext("2d", { willReadFrequently: true });

    let landmarker;
    let W = 0, H = 0, dpr = 1;
    let fillBox = null;  // smoothed face bounds in video pixels, so Fill doesn't jitter

    function resize() {
      dpr = window.devicePixelRatio || 1;
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    }
    window.addEventListener("resize", resize);
    resize();

    document.getElementById("startBtn").addEventListener("click", start);

    // Start downloading the wasm runtime and model as soon as the page opens,
    // so they are usually ready by the time the user taps Start camera.
    const landmarkerReady = (async () => {
      const fileset = await FilesetResolver.forVisionTasks(WASM);
      const options = (delegate) => ({
        baseOptions: { modelAssetPath: MODEL, delegate },
        runningMode: "IMAGE", numFaces: 1, outputFaceBlendshapes: true,
      });
      try {
        return await FaceLandmarker.createFromOptions(fileset, options("GPU"));
      } catch {
        return await FaceLandmarker.createFromOptions(fileset, options("CPU"));
      }
    })();
    landmarkerReady.catch(() => {});  // errors are reported when start() awaits it

    async function start() {
      const startMsg = document.getElementById("startMsg");
      const startBtn = document.getElementById("startBtn");
      startBtn.disabled = true;
      try {
        startMsg.textContent = "Starting camera…";
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
        });
        video.srcObject = stream;
        await video.play();

        startMsg.textContent = "Loading face model…";
        landmarker = await landmarkerReady;

        document.getElementById("start").hidden = true;
        document.getElementById("panel").hidden = false;
        requestAnimationFrame(frame);
      } catch (err) {
        console.error(err);
        startMsg.textContent = err.name === "NotAllowedError"
          ? "Camera permission was denied. Allow camera access and try again."
          : `Could not start: ${err.message || err}`;
        startBtn.disabled = false;
      }
    }

    let lastVideoTime = -1;
    let face = null, blend = null;

    // MediaPipe's face detector is short-range: it misses faces that are small in the frame
    // (e.g. sitting back on a couch). So we detect on a cropped "digital zoom" window (roi).
    // With no face, roi cycles through the full frame and zoomed tiles; once a face is found,
    // roi follows it at a size a few times the face.
    const crop = document.createElement("canvas");
    const cctx = crop.getContext("2d");
    let roi = null;          // {x, y, w, h} in video pixels, same aspect as the video
    let searchIdx = 0;

    function searchWindows(vw, vh) {
      const wins = [{ x: 0, y: 0, w: vw, h: vh }];
      for (const n of [2, 3]) {               // 3x3 tiles at 1/2 size, 5x5 tiles at 1/3 size
        const w = vw / n, h = vh / n, steps = 2 * n - 1;
        for (let j = 0; j < steps; j++)
          for (let i = 0; i < steps; i++)
            wins.push({ x: i * w / 2, y: j * h / 2, w, h });
      }
      return wins;
    }

    function roiAroundFace(pts, vw, vh) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of pts) {
        if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
      }
      const w = Math.min(vw, Math.max(vw / 4, 3 * (maxX - minX), 3 * (maxY - minY) * vw / vh));
      const h = w * vh / vw;
      const x = Math.min(vw - w, Math.max(0, (minX + maxX) / 2 - w / 2));
      const y = Math.min(vh - h, Math.max(0, (minY + maxY) / 2 - h / 2));
      if (!roi) return { x, y, w, h };
      const k = 0.3;  // smooth so the crop doesn't jitter
      return { x: roi.x + (x - roi.x) * k, y: roi.y + (y - roi.y) * k, w: roi.w + (w - roi.w) * k, h: roi.h + (h - roi.h) * k };
    }

    function detect() {
      const vw = video.videoWidth, vh = video.videoHeight;
      let win = roi;
      if (!win) {
        const wins = searchWindows(vw, vh);
        win = wins[searchIdx++ % wins.length];
      }
      const cw = Math.round(Math.min(win.w, 960)), ch = Math.round(cw * win.h / win.w);
      if (crop.width !== cw || crop.height !== ch) { crop.width = cw; crop.height = ch; }
      cctx.drawImage(video, win.x, win.y, win.w, win.h, 0, 0, cw, ch);
      const r = landmarker.detect(crop);  // IMAGE mode: VIDEO-mode tracking breaks when the crop moves
      const lm = r.faceLandmarks?.[0];
      if (lm) {
        // Landmarks are normalized to the crop; convert to normalized full-video coords.
        face = lm.map(p => ({ x: (win.x + p.x * win.w) / vw, y: (win.y + p.y * win.h) / vh, z: p.z }));
        blend = r.faceBlendshapes?.[0];
        roi = roiAroundFace(face.map(p => ({ x: p.x * vw, y: p.y * vh })), vw, vh);
      } else {
        face = blend = null;
        roi = null;
      }
    }

    function frame() {
      requestAnimationFrame(frame);
      if (video.readyState < 2) return;
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        detect();
      }
      updateStatus(face, blend);
      draw(face);
    }

    // Counts how many times a state turns on and off, and how long it stays on (mirrors EventCounter in the iOS app).
    function eventCounter() {
      let start = null;
      return {
        count: 0, total: 0,
        get average() { return this.count ? this.total / this.count : 0; },
        update(isOn, t = performance.now() / 1000) {
          if (isOn) { if (start === null) start = t; }
          else if (start !== null) { this.count++; this.total += t - start; start = null; }
        },
        cancel() { start = null; },
      };
    }
    // Completed blinks (both eyes) and smiles, with how long each lasted.
    const blinks = eventCounter(), smiles = eventCounter();

    function updateStatus(face, blend) {
      if (!face || !blend) {
        statusEl.textContent = "No face detected";
        valuesEl.textContent = countsEl.textContent = "";
        // A blink or smile in progress when the face is lost is not counted.
        blinks.cancel(); smiles.cancel();
        fillBox = null;
        return;
      }
      const score = name => blend.categories.find(c => c.categoryName === name)?.score ?? 0;
      const smile = (score("mouthSmileLeft") + score("mouthSmileRight")) / 2;
      const blinkL = score("eyeBlinkLeft");
      const blinkR = score("eyeBlinkRight");

      const parts = [];
      if (smile > SMILE_THRESHOLD) parts.push("Smiling");
      const l = blinkL > BLINK_THRESHOLD, r = blinkR > BLINK_THRESHOLD;
      blinks.update(l && r);
      smiles.update(smile > SMILE_THRESHOLD);
      countsEl.textContent = `blinks ${blinks.count}  avg ${blinks.average.toFixed(2)}s   smiles ${smiles.count}  avg ${smiles.average.toFixed(2)}s`;
      if (l && r) parts.push("Blinking");
      else if (l) parts.push("Winking left");
      else if (r) parts.push("Winking right");
      statusEl.textContent = parts.length ? parts.join(" + ") : "Neutral";
      valuesEl.textContent = `smile ${smile.toFixed(2)}   blink L ${blinkL.toFixed(2)}   blink R ${blinkR.toFixed(2)}`;
    }

    // Maps video pixels to screen: mirrored (selfie view) and scaled to cover the screen.
    function coverTransform(vw, vh) {
      const s = Math.max(W / vw, H / vh);
      return [-s, 0, 0, s, W / 2 + s * vw / 2, H / 2 - s * vh / 2];
    }

    // Maps video pixels to screen so the face is centered and scaled to fill the screen.
    function fillTransform(pts) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of pts) {
        if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
      }
      const box = { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, w: maxX - minX, h: maxY - minY };
      if (!fillBox) fillBox = box;
      else for (const k in box) fillBox[k] += (box[k] - fillBox[k]) * 0.2;
      const s = 0.95 * Math.min(W / fillBox.w, H / fillBox.h);
      return [-s, 0, 0, s, W / 2 + s * fillBox.cx, H / 2 - s * fillBox.cy];
    }

    function draw(face) {
      const vw = video.videoWidth, vh = video.videoHeight;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);

      const cover = coverTransform(vw, vh);
      const setT = m => { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.transform(...m); };

      // Full-screen camera background, shown when video is on and not masked,
      // and always when no face is detected so the screen isn't black.
      if (!face || (layers.showVideo && !layers.maskVideo)) {
        setT(cover);
        ctx.drawImage(video, 0, 0, vw, vh);
      }
      if (!face) return;

      const pts = face.map(p => ({ x: p.x * vw, y: p.y * vh }));
      const faceT = layers.fillScreen ? fillTransform(pts) : (fillBox = null, cover);
      setT(faceT);
      const lineScale = Math.hypot(faceT[0], faceT[1]);

      // Mask: camera pixels only inside the face oval (eyes and mouth included).
      if (layers.maskVideo) {
        ctx.save();
        ctx.beginPath();
        OVAL.forEach((i, n) => n ? ctx.lineTo(pts[i].x, pts[i].y) : ctx.moveTo(pts[i].x, pts[i].y));
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(video, 0, 0, vw, vh);
        ctx.restore();
      }

      // Color: each triangle filled with the camera color at its center.
      if (layers.showColor) {
        const sw = Math.min(320, vw), sh = Math.round(vh * sw / vw);
        if (sampler.width !== sw || sampler.height !== sh) { sampler.width = sw; sampler.height = sh; }
        sctx.drawImage(video, 0, 0, sw, sh);
        const data = sctx.getImageData(0, 0, sw, sh).data;
        const k = sw / vw;
        ctx.lineWidth = 0.75 / lineScale;  // stroke in the same color to hide seams
        ctx.lineJoin = "round";
        for (const [a, b, c] of TRIANGLES) {
          const A = pts[a], B = pts[b], C = pts[c];
          const x = Math.min(sw - 1, Math.max(0, Math.round((A.x + B.x + C.x) / 3 * k)));
          const y = Math.min(sh - 1, Math.max(0, Math.round((A.y + B.y + C.y) / 3 * k)));
          const o = (y * sw + x) * 4;
          const color = `rgb(${data[o]},${data[o + 1]},${data[o + 2]})`;
          ctx.fillStyle = ctx.strokeStyle = color;
          ctx.beginPath();
          ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(C.x, C.y);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
        }
      }

      // Mesh: wireframe on top.
      if (layers.showMesh) {
        ctx.strokeStyle = MESH_COLOR;
        ctx.lineWidth = 1 / lineScale;
        ctx.beginPath();
        for (const [a, b] of EDGES) {
          ctx.moveTo(pts[a].x, pts[a].y);
          ctx.lineTo(pts[b].x, pts[b].y);
        }
        ctx.stroke();
      }

      // Outline: eyes and mouth in a line that steps through red, gold, green every second.
      ctx.strokeStyle = OUTLINE_COLORS[Math.floor(performance.now() / 1000) % OUTLINE_COLORS.length];
      ctx.lineWidth = 4 / lineScale;
      ctx.lineCap = ctx.lineJoin = "round";
      ctx.beginPath();
      for (const [a, b] of OUTLINE_EDGES) {
        ctx.moveTo(pts[a].x, pts[a].y);
        ctx.lineTo(pts[b].x, pts[b].y);
      }
      ctx.stroke();
    }
  </script>
</body>
</html>
